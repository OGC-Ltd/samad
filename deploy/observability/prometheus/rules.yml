# The system checks. Each is an alert: Prometheus evaluates it every 15 s, and
# a firing one shows in the dashboard's "Checks" row (the ALERTS series) and
# under Grafana › Alerting. No Alertmanager is run, so nothing is sent
# anywhere yet; add one (or a Grafana contact point) to be paged.
#
# severity: warning = look today; critical = look now.

groups:
  - name: samad-checks
    rules:
      - alert: SamadDown
        expr: up{job="samad"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Prometheus cannot scrape Samad
          description: The API is down, restarting, or the metrics token does not match.

      - alert: PartnerFeedStale
        expr: time() - samad_poll_last_success_timestamp_seconds{poll="positions"} > 300
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: No good position read from the partner API for {{ $value | humanizeDuration }}
          description: The live map is going stale. Check the partner API and PARTNER_API_KEY.

      - alert: PartnerFeedDown
        expr: time() - samad_poll_last_success_timestamp_seconds{poll="positions"} > 900
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: No good position read from the partner API for {{ $value | humanizeDuration }}

      - alert: ServerErrorRate
        expr: |
          sum(rate(samad_http_requests_total{code="5xx"}[5m]))
            / sum(rate(samad_http_requests_total[5m])) > 0.05
          and sum(rate(samad_http_requests_total[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} of requests are failing with 5xx"

      - alert: SlowResponses
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(samad_http_request_duration_seconds_bucket[5m]))) > 3
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 95th percentile response time is {{ $value | humanizeDuration }}

      - alert: OutsideServiceFailing
        expr: |
          sum by (service) (rate(samad_outbound_requests_total{outcome="error"}[10m]))
            / sum by (service) (rate(samad_outbound_requests_total[10m])) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }}: {{ $value | humanizePercentage }} of calls failing"

      - alert: MemoryNearLimit
        expr: samad_container_memory_bytes / samad_container_memory_limit_bytes > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: Samad is at {{ $value | humanizePercentage }} of its memory limit
          description: Past the limit the container is killed and restarted. Raise APP_MEM_LIMIT or find the growth.

      - alert: CPUSaturated
        expr: avg_over_time(samad_process_cpu_percent[10m]) > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: Samad has used over 90% of its CPU for 10 minutes

      - alert: HostCPUHigh
        expr: avg_over_time(samad_host_cpu_percent[10m]) > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: The box has been over 90% CPU for 10 minutes

      - alert: DiskLow
        expr: samad_data_disk_free_bytes / samad_data_disk_total_bytes < 0.10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $value | humanizePercentage }} disk left on the data volume"

      - alert: DiskCritical
        expr: samad_data_disk_free_bytes / samad_data_disk_total_bytes < 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $value | humanizePercentage }} disk left on the data volume"

      - alert: DataDirNotWritable
        expr: samad_data_dir_writable == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: Samad cannot write its data folder; alert reads and decisions will not be saved
