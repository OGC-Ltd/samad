# Scrapes Samad's /metrics every 15 s. The token is the METRICS_TOKEN in
# Samad's server/.env, copied to ../secrets/metrics-token (see README.md).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: samad
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      # The container name on the shared `proxy` network (STACK in Samad's .env).
      - targets: ["samad:8080"]
        labels:
          service: samad

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
